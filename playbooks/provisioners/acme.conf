# Автоматический выпуск TLS-сертификатов по протоколу ACME (Certbot, Caddy, Traefik, acme.sh).
# Валидация через внутренний DNS (dns-01) или порты 80/443 веб-серверов (http-01, tls-alpn-01).
NAME=acme
TYPE=ACME
DEFAULT_DURATION=720h
MAX_DURATION=2160h
CHALLENGES="http-01,dns-01,tls-alpn-01"
FORCE_CN=true
DESCRIPTION="Automated ACME TLS for web servers and reverse proxies"
