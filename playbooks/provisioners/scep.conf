# Сертификаты для сетевого оборудования (Cisco, MikroTik, Wi-Fi AP) и MDM по SCEP (RFC 8894).
# Требует RSA Intermediate CA (или decrypter cert) и challenge secret.
NAME=scep
TYPE=SCEP
CHALLENGE=""
MIN_PUBLIC_KEY_LENGTH=2048
ENCRYPTION_ALGORITHM_IDENTIFIER=2
FORCE_CN=true
DESCRIPTION="SCEP provisioner for managed switches, routers, and network devices"
