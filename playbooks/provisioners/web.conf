# TLS-серверы (nginx, caddy, reverse-proxy).
NAME=web
TYPE=JWK
DEFAULT_DURATION=720h
MAX_DURATION=4380h
DESCRIPTION="TLS server certificates"
# Ограничение SAN доменов (через запятую или пробел, например: corp.local, internal.lan).
# Если задано, CA отклонит выпуск сертификатов для SAN вне указанных доменов.
# Если пусто — без ограничений по доменам.
ALLOWED_DOMAINS=""
