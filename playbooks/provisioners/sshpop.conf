# Продление, обновление ключа (rekey) и отзыв выданных хостовых SSH-сертификатов (SSHPOP).
# Не выпускает сертификаты с нуля; позволяет хостам обновлять SSH-сертификат по подтверждению владения текущим.
NAME=sshpop
TYPE=SSHPOP
DESCRIPTION="SSHPOP provisioner for host SSH certificate renewal and rekey"
