services:

  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      TZ: "${TZ:-UTC}"
      POSTGRES_DB:       stepui
      POSTGRES_USER:     stepui
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stepui_secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - step-net
    privileged: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stepui -d stepui"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── Step-CA UI (Go) ───────────────────────────────────────────────────────
  step-ui:
    privileged: true
    build:
      context: ./step-ui-go
      dockerfile: Dockerfile
    container_name: step-ui
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "${CA_PUBLIC_HOST:-host.docker.internal}:host-gateway"
    ports:
      - "${UI_HTTPS_PORT:-443}:8443"
    volumes:
      - step-ui-certs:/opt/step-ui/certs
      - step-ui-ssl:/opt/step-ui/ssl
      - step-ui-data:/opt/step-ui/data
      - step-ui-uploads:/opt/step-ui/uploads
    environment:
      TZ: "${TZ:-UTC}"
      DATABASE_URL: "postgres://stepui:${POSTGRES_PASSWORD:-stepui_secret}@postgres:5432/stepui?sslmode=disable"
      CA_MODE:       "${CA_MODE:-bundled}"
      CA_URL:        "${CA_URL:-https://step-ca:9443}"
      ROOT_CERT:     "${ROOT_CERT:-/home/step/certs/root_ca.crt}"
      PROVISIONER:   "${PROVISIONER:-admin}"
      PASSWORD_FILE: "/opt/step-ui/data/provisioner_password"
      PROVISIONER_PASSWORD: "${CA_PASSWORD:-change-me-min-8-chars}"
      SECRET_KEY:    "${SECRET_KEY:-change-me-to-a-long-random-string-at-least-32-chars}"
      SESSION_SECURE: "${SESSION_SECURE:-true}"
      ENABLE_HSTS:   "${ENABLE_HSTS:-false}"
      STEP_CA_IMAGE:  "${STEP_CA_IMAGE:-smallstep/step-ca:0.30.2}"
      METRICS_TOKEN: "${METRICS_TOKEN:-}"
      HOST_IP:       "${HOST_IP:-127.0.0.1}"
      PORT:          "8443"
      STEPUI_ADMIN_PASSWORD: "${STEPUI_ADMIN_PASSWORD:-}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - step-net
    healthcheck:
      test: ["CMD", "curl", "-sk", "-o", "/dev/null", "-w", "%{http_code}", "--max-time", "3", "https://localhost:8443/login"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

# ─── Volumes ───────────────────────────────────────────────────────────────
volumes:
  postgres-data:
  step-ui-certs:
  step-ui-ssl:
  step-ui-data:
  step-ui-uploads:

# ─── Networks ──────────────────────────────────────────────────────────────
networks:
  step-net:
    driver: bridge
    name: step-network
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "true"
